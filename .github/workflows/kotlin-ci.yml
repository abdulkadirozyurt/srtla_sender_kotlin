name: Kotlin CI
on:
  push:
    branches: [main]
    paths: ["kotlin/**", ".github/workflows/kotlin-ci.yml"]
  pull_request:
    paths: ["kotlin/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run testkit suite via Gradle
        run: ./gradlew --no-daemon test
