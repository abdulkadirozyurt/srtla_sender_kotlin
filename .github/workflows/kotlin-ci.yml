name: Kotlin CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run testkit suite via Gradle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test
